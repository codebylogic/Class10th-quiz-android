name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '[".]' '/version/ {if ($2 == "1") print $3; else print $2}')
          echo "Detected Java major version: ${JAVA_MAJOR}"
          if [ -z "${JAVA_MAJOR}" ] || [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "::error::Active Java major version (${JAVA_MAJOR:-unknown}) is lower than 17. Java 17 or newer is required."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode the fixed signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set — falling back to a temporary debug keystore (the APK signature will change every run)."
            exit 0
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/signing.p12"
          if [ ! -s "${RUNNER_TEMP}/signing.p12" ]; then
            echo "::error::Failed to decode the signing keystore."
            exit 1
          fi
          echo "SIGNING_KEYSTORE_PATH=${RUNNER_TEMP}/signing.p12" >> "${GITHUB_ENV}"
          echo "Fixed signing keystore decoded."

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Temporary debug keystore ./debug.keystore already exists."
          else
            echo "Generating temporary ./debug.keystore using Java 17 keytool..."
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt >/dev/null 2>&1
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Confirmed ./debug.keystore is present."

      - name: Build debug APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Show APK signing certificate
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER=$(ls -1 "${ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "${APKSIGNER}" ] && [ -f "${APK}" ]; then
            "${APKSIGNER}" verify --print-certs "${APK}" || true
          else
            echo "apksigner not found; skipping certificate print."
          fi

      - name: Verify debug APK output
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "${EXPECTED_APK}" ]; then
            echo "Verified debug APK exists at ${EXPECTED_APK}"
          else
            echo "::warning::Expected APK not found at ${EXPECTED_APK}. Searching inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              FOUND_APKS=$(find app/build/outputs/apk -type f -name "*.apk" || true)
              if [ -n "${FOUND_APKS}" ]; then
                echo "Discovered APK paths inside app/build/outputs/apk:"
                echo "${FOUND_APKS}"
              else
                echo "No APK files found inside app/build/outputs/apk."
              fi
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            echo "::error::Required debug APK missing at ${EXPECTED_APK}."
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
